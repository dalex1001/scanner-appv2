name: Build Windows Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare backend virtual environment
        working-directory: backend
        shell: pwsh
        run: |
          if (Test-Path venv) {
            Remove-Item -Recurse -Force venv
          }
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build backend executable
        working-directory: backend
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          pyinstaller --noconfirm --clean --onefile --name scanner-api `
            --paths . --distpath dist --workpath build `
            --collect-all fastapi --collect-all starlette --collect-all pydantic `
            --collect-all uvicorn run.py

      - name: Install Ionic dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Build Electron App
        working-directory: frontend
        run: npx electron-builder --win nsis --config electron-builder.yml

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: frontend/release/*.exe
          if-no-files-found: error